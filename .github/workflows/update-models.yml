name: Upstream model catalog PR

# Weekly: regenerate zerostack's data/models.json from models.dev, push the
# refreshed catalog as a branch on the xavierforge/zerostack fork, and open
# (or update) a pull request against upstream gi-dellav/zerostack.
#
# This lives in its own repo because scheduled workflows only run on a repo's
# default branch, and the fork keeps `main` level with upstream, so the fork
# cannot carry a fork-only workflow commit.
#
# Secrets:
# - FORK_SYNC_PAT: a fine-grained PAT limited to the xavierforge/zerostack
#   fork, with Contents and Workflows write. Syncs the fork's default branch
#   and pushes the refresh branch. Workflows write is required because
#   upstream commits routinely touch .github/workflows/ (dependabot bumps),
#   and GitHub rejects any push or merge-upstream carrying such a commit
#   from a token without it.
# - UPSTREAM_PR_PAT: a classic PAT with the `public_repo` scope. Opens the
#   PR on upstream in the name of the token's owner. Stays classic because
#   fine-grained tokens cannot contribute to public repos the owner is not
#   a member of. It also serves as the fallback for FORK_SYNC_PAT while that
#   secret is unset, which reproduces the pre-September-2026 behaviour.

on:
  schedule:
    # Weekly, Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: write # keepalive: reset GitHub's 60-day scheduled-workflow disable timer

env:
  UPSTREAM: gi-dellav/zerostack
  FORK: xavierforge/zerostack
  FORK_OWNER: xavierforge
  BRANCH: chore/refresh-model-catalog

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bot scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bot

      - name: Check out upstream zerostack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gi-dellav/zerostack
          ref: main
          path: zerostack
          persist-credentials: false

      # Scheduled workflows in a repo with no commit activity are disabled by
      # GitHub after 60 days; re-enabling on every run resets that timer.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update-models.yml --repo "${{ github.repository }}" || echo "keepalive skipped"

      - name: Regenerate catalog
        run: |
          cp zerostack/data/models.json old-models.json
          zerostack/scripts/gen-models-catalog.sh

      - name: Detect changes
        id: diff
        run: |
          if cmp -s old-models.json zerostack/data/models.json; then
            echo "Catalog unchanged; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Render PR body
        if: steps.diff.outputs.changed == 'true'
        run: bot/scripts/catalog-diff.sh old-models.json zerostack/data/models.json | tee pr-body.md

      # The refresh branch is cut from upstream, so pushing it to the fork
      # carries every upstream commit the fork is still missing. Keeping the
      # fork's default branch level first leaves the catalog commit as the
      # only new one in the push. This is a server-side fast-forward, but it
      # still needs Workflows write on the token whenever a pending upstream
      # commit touches .github/workflows/; the 2026-08-31 run failed here with
      # a 422 for exactly that reason. Left non-fatal on purpose: with
      # FORK_SYNC_PAT set the push below succeeds regardless, and if the fork
      # has diverged and cannot fast-forward, the push is the honest place to
      # fail.
      - name: Sync fork default branch with upstream
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_PAT || secrets.UPSTREAM_PR_PAT }}
        run: |
          gh api --method POST "repos/$FORK/merge-upstream" -f branch=main \
            --jq '"fork main: " + (if .merge_type == "none" then "already level with upstream" else .merge_type end)' \
            || echo "fork sync failed; see the push step for whether it mattered"

      - name: Push refresh branch to fork
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_PAT || secrets.UPSTREAM_PR_PAT }}
        run: |
          cd zerostack
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/models.json
          git commit -m "chore: refresh model catalog from models.dev"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${FORK}.git" "$BRANCH"

      - name: Open or update upstream PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PR_PAT }}
        run: |
          existing="$(gh api "repos/$UPSTREAM/pulls?head=$FORK_OWNER:$BRANCH&state=open" --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            # Plain REST, not `gh pr edit`: the latter's GraphQL prefetch
            # needs `read:org`, which UPSTREAM_PR_PAT deliberately lacks.
            gh api --method PATCH "repos/$UPSTREAM/pulls/$existing" \
              -F body=@pr-body.md --jq '"Updated existing PR #" + (.number | tostring)'
          else
            gh pr create --repo "$UPSTREAM" --base main \
              --head "$FORK_OWNER:$BRANCH" \
              --title "chore: refresh model catalog from models.dev" \
              --body-file pr-body.md
          fi
